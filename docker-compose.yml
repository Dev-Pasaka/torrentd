services:
  torrentd:
    build: .
    image: torrentd
    container_name: torrentd
    restart: unless-stopped

    # Files written into ./downloads are owned by this uid/gid. Defaults match
    # the image's `node` user; set PUID/PGID in .env to your own (`id -u`/`id -g`)
    # if the downloads end up owned by the wrong user.
    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      # Web UI. Bound to localhost only — Basic auth sends credentials in the
      # clear, so put it behind a TLS reverse proxy before using "8080:8080".
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
      # BitTorrent peer connections (TCP) and DHT (UDP). These must be two
      # different numbers — WebTorrent binds them independently and fails with
      # EADDRINUSE if they collide. Forward both on your router so peers can
      # reach you; without that you can still connect out, just to fewer peers.
      - "${BT_PORT:-6881}:6881/tcp"
      - "${DHT_PORT:-6882}:6882/udp"

    volumes:
      # Completed downloads. Point the left side anywhere on the host you like,
      # e.g. /Volumes/Media:/downloads — see the note in the README about the
      # in-app folder picker showing container paths, not host paths.
      - ./downloads:/downloads
      # SQLite database — the queue and settings live here.
      - ./data:/data

    environment:
      # Leave both unset to have a password generated on first run and printed
      # to `docker compose logs torrentd`.
      TORRENTD_USER: ${TORRENTD_USER:-}
      TORRENTD_PASS: ${TORRENTD_PASS:-}
      # Set to 1 to let the client ask your router to open BT_PORT for it.
      # Off by default: nat-api crashes the process on a port bind conflict.
      NAT_UPNP: ${NAT_UPNP:-}
      NAT_PMP: ${NAT_PMP:-}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
