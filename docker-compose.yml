services:
  torrentd:
    build: .
    image: torrentd
    container_name: torrentd
    restart: unless-stopped
    depends_on:
      - moviesapi

    # Files written into ./downloads are owned by this uid/gid. Defaults match
    # the image's `node` user; set PUID/PGID in .env to your own (`id -u`/`id -g`)
    # if the downloads end up owned by the wrong user.
    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      # Web UI. Bound to localhost only — Basic auth sends credentials in the
      # clear, so put it behind a TLS reverse proxy before using "8080:8080".
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
      # Peers listen on BT_PORT over *both* protocols: TCP for classic
      # BitTorrent, UDP for uTP (webtorrent's conn pool binds one server each on
      # the same number). Publishing only one of the two halves your inbound
      # peers. DHT is a separate UDP socket and must be a different number —
      # WebTorrent binds them independently and fails with EADDRINUSE if they
      # collide. Forward all three on your router so peers can reach you;
      # without that you can still connect out, just to fewer peers.
      - "${BT_PORT:-6881}:6881/tcp"
      - "${BT_PORT:-6881}:6881/udp"
      - "${DHT_PORT:-6882}:6882/udp"

    volumes:
      # Completed downloads. Set DOWNLOADS_DIR in .env to any host path —
      # relative to this file (./downloads) or absolute (/Volumes/Media,
      # /srv/jellyfin/media/Shows&Movies). The container side stays /downloads,
      # so moving the mount never invalidates the saved download_path setting.
      # See the README note: the in-app folder picker browses container paths.
      - "${DOWNLOADS_DIR:-./downloads}:/downloads"
      # SQLite database — the queue and settings live here.
      - "${DATA_DIR:-./data}:/data"
      # Extra libraries, if you want more than one destination to pick from in
      # Settings, or a separate library to organize into via the Files page
      # (see LIBRARY_DIRS below — each mount here needs a matching entry
      # there to actually show up in Files, browsing-for-a-download-path
      # works for anything under /downloads regardless):
      # - "/mnt/tank/movies:/media/movies"
      # - "/mnt/tank/shows:/media/shows"

    environment:
      # Leave both unset to have a password generated on first run and printed
      # to `docker compose logs torrentd`.
      TORRENTD_USER: ${TORRENTD_USER:-}
      TORRENTD_PASS: ${TORRENTD_PASS:-}
      # Set to 1 to let the client ask your router to open BT_PORT for it.
      # Off by default: nat-api crashes the process on a port bind conflict.
      NAT_UPNP: ${NAT_UPNP:-}
      NAT_PMP: ${NAT_PMP:-}
      # Powers the "Browse" search tab. Leave blank to disable it.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Torrent search on a title's page. Points at the moviesapi service
      # below via Docker's internal DNS — leave as-is unless moviesapi runs
      # elsewhere.
      MOVIESAPI_URL: ${MOVIESAPI_URL:-http://moviesapi:8000}
      # Named, comma-separated Name:/container/path roots for the Files page
      # (browse/delete/copy/move). Each name here needs a matching volume
      # mount above — this is deliberately not a free-text host path, so the
      # feature can only ever touch directories you've explicitly mounted in.
      LIBRARY_DIRS: ${LIBRARY_DIRS:-Downloads:/downloads}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  moviesapi:
    build: ./moviesapi
    image: moviesapi
    container_name: moviesapi
    restart: unless-stopped

    # Not published to the host — only torrentd talks to it, over the
    # compose-internal network.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
